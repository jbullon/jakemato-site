name: Update movie releases

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch movie releases from TMDB
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: python scripts/fetch_movies.py

      - name: Build Stremio movie catalogs
        run: python scripts/build_stremio_catalog.py

      - name: Commit refreshed movie data
        run: |
          if git diff --quiet -- tools/movies/data/movies.json stremio/movies; then
            echo "Movie and Stremio data are already current."
            exit 0
          fi

          START_SHA="$(git rev-parse HEAD)"
          git fetch origin master

          if [ "$(git rev-parse origin/master)" != "$START_SHA" ]; then
            echo "::notice::master changed while the movie ETL was running. Discarding stale generated data; a later run will refresh from the new code."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/movies/data/movies.json stremio/movies
          git commit -m "Update movie release data"

          if ! git push; then
            git fetch origin master
            if [ "$(git rev-parse origin/master)" != "$START_SHA" ]; then
              echo "::notice::master changed immediately before push. Generated data was not published because it was based on an older commit."
              exit 0
            fi

            echo "::error::Movie data push failed for a reason other than master changing."
            exit 1
          fi
